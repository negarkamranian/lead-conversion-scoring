[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lead-scoring"
version = "0.1.0"
description = "PostgreSQL-backed lead prioritization take-home solution"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio==4.14.0",
  "joblib==1.4.2",
  "matplotlib==3.10.0",
  "mlflow==3.15.2",
  "numpy==2.2.2",
  "pandas==2.2.3",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.2.4",
  "scikit-learn==1.6.1",
  "scipy==1.15.1",
]

[dependency-groups]
dev = [
  "mypy==1.14.1",
  "pandas-stubs==2.2.3.241126",
  "pytest==8.3.4",
  "ruff==0.9.4",
]

[project.scripts]
lead-scoring = "lead_scoring.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["lead_scoring"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# These runtime dependencies do not publish PEP 561 typing metadata.
module = ["joblib", "sklearn.*"]
ignore_missing_imports = true
